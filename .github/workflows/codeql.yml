name: "CodeQL"
on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '15 6 * * 1'
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4.37.4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:python"
