version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: .
        target: /repo
      - codedna_data:/root/.codedna
    environment:
      - CODEDNA_REPO_PATH=/repo
      - CODEDNA_DB_PATH=/root/.codedna/codedna.db
    command: codedna serve --host 0.0.0.0 --port 8000
    restart: unless-stopped

  dashboard:
    build:
      context: dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  codedna_data:
