[project]
name = "codedna"
version = "0.3.4"
description = "AI Code Transparency Tool - detect AI-written code and measure developer understanding"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "NatureCo", email = "hello@natureco.me"},
]
maintainers = [
    {name = "Gencay Olgun", email = "info@natureco.me"},
]
license = {text = "MIT"}
keywords = ["ai", "code-analysis", "developer-tools", "transparency", "devops", "git", "code-quality", "team-analytics", "ai-detection", "sprint-health", "bus-factor", "technical-debt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.138.0",
    "gitpython>=3.1.50",
    "pyjwt>=2.13.0",
    "rich>=15.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.49.0",
]

[project.optional-dependencies]
dashboard = [
    "next-cmd>=0.5.0",  # Next.js process management
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://codedna.dev"
Repository = "https://github.com/natureco-official/codedna"
Issues = "https://github.com/natureco-official/codedna/issues"
Changelog = "https://github.com/natureco-official/codedna/blob/main/CHANGELOG.md"

[project.scripts]
codedna = "codedna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codedna"]

[tool.hatch.build.targets.wheel.shared-data]
"codedna/assets" = "codedna/assets"
