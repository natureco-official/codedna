[project]
name = "codedna"
version = "0.1.0"
description = "AI kod şeffaflık aracı — her commit'te AI yazım oranını ve anlama skorunu ölçer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.138.0",
    "gitpython>=3.1.50",
    "pyjwt>=2.13.0",
    "rich>=15.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.26.7",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
codedna = "codedna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
